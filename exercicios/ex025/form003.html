<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Testando Formulários</h1>
    <form action="formulario.php" method="get">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required minlength="5" maxlength="20" placeholder="Nome Completo" autocomplete="name">
        </p>

        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" required  placeholder="Senha" autocomplete="current-password">
        </p>

        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" step="0.5" required placeholder="0 a 10"  min="0" max="10" value="5">
        </p>

        <p>
            <label for="imes">Mês</label>
            <input type="month" name="mes" id="imes" value="2026-11">
        </p>

        <p>
            <label for="idia">Dia da Prova:</label>
            <input type="date" name="Dia" id="idia" value="2026-11-05">
        </p>

        <p>
            <label for="ihora"> Hora da Prova:</label>
            <input type="time" name="Hora" id="ihora"  value="16:53">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
