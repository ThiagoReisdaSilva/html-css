<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>

          body {
            background-image: url(imagem.jpg);
            background-repeat: no-repeat;
            
            background-size: cover;
            

        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: rgb(104, 241, 241);
        }

        a:hover {
            color: blue;
            text-decoration: underline;
        }

        a::after{
            content: " [link]";
            color: gray;
            text-decoration: none;
            font-weight: normal;
        }


      
        main {
            background-color: rgba(69, 128, 153, 0.829);
            width: 600px;
            margin: auto;
            padding: 20px;
            text-align: center;
            border-radius: 20px;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <main>
        <h1>personalizando links</h1>
        <ul>
            <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório Github</a></li>
            <li><a href="https://youtube.com/cursoemvideo/" target="_blank">Canal do YouTube</a></li>
            <li><a href="https://www.cursoemvideo.com" target="_blank">Site do Curso em Vídeo</a></li>
        </ul>
    </main>
</body>
</html>
