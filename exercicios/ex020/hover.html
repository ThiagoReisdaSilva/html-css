<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover</title>
    <style>
        body {
            background-color: aquamarine;
        }

        div {
            color: rgb(255, 21, 0);
            background-color: aqua;
            width: 200px;
            height: 200px;
            margin: auto;
            text-align: center;
            

        }
        div:hover {
            color: rgb(20, 20, 220);
        }

        div > p {
            display: none;
        }

        div:hover >p {
            display: block;
            background-color: aliceblue;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <h1>exemplos de hover</h1>
    <p>passe o mouse sobre o texto abaixo</p>
    <div>
        passe o mouse aqui
        <p>texto escondido</p>
    </div>
    <p>fim do exemplo</p>
</body>
</html>
