<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuando estudos sobre formulários
    </title>
</head>
<body>
    <h1>Aprendendo mais sobre formulários</h1>
    <form action="form.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Mais tipos de escolhas de formulários</legend>
        
      <p>
        <label for="in1">Número 1:</label>
        <input type="number" name="num1" id="in1" required min="1" max="20" oninput="total.innerHTML=Number(in1.value)+Number(in2.value)">
      </p>

      <p>
        <label for="in2">Número 2:</label>
        <input type="number" name="num2" id="in2" required min="1" max="20" oninput="total.innerHTML=Number(in1.value)+Number(in2.value)">
      </p>

      <p>
        <label for="total">Total:</label>
        <output name="tot" id="total">5</output>
      </p>

<p>
    <label for="meunum"> Meu número:</label>
    <input type="range" name="num" id="meunum" min="0" max="100" value="5" oninput="tudo.innerHTML=Number(meunum.value)*Number(in2.value)">
    <output id="tudo">5</output>
</p>

<p>
    <label for="iano">Qual o ano do seu nascimento:</label>
    <input type="number" name="ano" id="iano" required min="1900" max="2026" value="2015" oninput="caLcIdade()">
</p>

<p>
    <label for="iidade">Então esse ano sua idade será:</label>
    <output id="iidade">anos</output>
</p>

<script>
    function caLcIdade() {
        let atual=new Date().getFullYear()
        iidade.innerHTML= Number(atual)-Number(iano.value)
    }
</script>

        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
