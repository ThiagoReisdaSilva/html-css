<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centralizando caixas uma dentro da outra</title>
    <style>
       #fora {
        background: purple;
        background-image: url(imagens/target001.png);
        background-size: 100% 100%;
        height: 100vh;
        position: relative;

       }

       #dentro {
        background: yellow;
        background-image: url(imagens/target001.png);
        background-size: 100% 100%;
        height: 300px;
        width: 300px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

       }
    </style>

</head>
<body>
<section id="fora">
    <article id="dentro">

    </article>
</section>
</body>
</html>
