<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meus hovers</title>
    <style>
        div:hover {
            color: brown;
        }

        div>p {
            display: none;
        }

        div:hover > p {
            display: block;
        }
    </style>
</head>
<body>
    <h1>testando meus próprios hovers</h1>
    <p>passe o mouse no texto abaixo</p>
    <div>passe o mouse aqui
        <p>texto escondido</p>
    </div>
    <p>fim do exemplo!!!</p>

    
</body>
</html>
