<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midias em html</title>
</head>
<body>
    <h1>imagem dinâmica</h1>
    <p>tente abrir esse site em dispositivos diferentes ou simplesmente
        aumente e diminua o tamanho do seu navegador
    </p>
    <picture>
        <source media="(max-width:750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>reproduzindo áudios</h1>
    <p>vamos aprender a reproduzir áudios em html5</p>
    

    <audio controls>
        <source src="midia/Orange Foot - Dan Henig.mp3" type="audio/mpeg">
        <source src="midia/Orange Foot - Dan Henig.ogg" type="audio/ogg">
        <source src="midia/Orange Foot - Dan Henig.wav" type="audio/wav">
        <p>
            infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/Orange Foot - Dan Henig.mp3">clique aqui para dowload</a>
        </p>
    </audio>

</body>
</html>
