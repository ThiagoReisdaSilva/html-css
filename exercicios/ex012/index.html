<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vídeos com html5</title>
</head>
<body>
    <h1>inserindo vídeos hospedados localmente</h1>
    <p>este vídeo está hospedado no meu próprio servidor</p>
    <video poster="imagens/céu.png" controls autoplay loop width="560">
<source src="midia/meu-video.webm" type="video/webm">
<source src="midia/meu-video.mp4" type="video/mp4">
<source src="midia/meu-video.mkv" type="video/mp4">
    </video>
    <h1>incorporando videos de servidores externos</h1>
    <p>este video é do servidor do youtube</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/05MF_6XN374?si=pwscUpYONUvqM42D" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
